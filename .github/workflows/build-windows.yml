name: Windows 설치 파일 빌드

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        timeout-minutes: 10
        run: python -m pip install --progress-bar off --timeout 60 -r requirements.txt pyinstaller pytest

      - name: 테스트
        run: python -m pytest -q tests

      - name: 버전 읽기
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import pccam; print(pccam.__version__)')" >> "$GITHUB_OUTPUT"

      - name: PyInstaller 빌드
        run: python -m PyInstaller --noconfirm --clean --windowed --name PCCam --icon assets\pccam.ico --add-data "assets;assets" main.py

      - name: 실행 파일 확인
        shell: bash
        run: test -f dist/PCCam/PCCam.exe

      - name: Inno Setup 준비
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: 설치 파일 만들기
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer\pccam.iss'

      - name: 휴대용(zip) 버전 만들기
        shell: pwsh
        run: Compress-Archive -Path dist\PCCam\* -DestinationPath "dist\PCCam-Portable-${{ steps.ver.outputs.version }}.zip"

      - name: 결과물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: PCCam-${{ steps.ver.outputs.version }}-windows
          path: |
            dist/PCCam-Setup-*.exe
            dist/PCCam-Portable-*.zip

      - name: 릴리스 만들기 (v 태그일 때)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PCCam-Setup-*.exe
            dist/PCCam-Portable-*.zip
